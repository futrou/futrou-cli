<!doctype html>
<html lang="en"{{THEME_ATTR}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | Futrou CLI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf8;--bg2:#f4f4f7;--card:#fff;--text:#1d1d1f;--muted:#5c5c63;--border:#e4e4e7;--glow:rgba(248,198,56,.35);--ok:#22a352;--bad:#dc2626;--ring:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131316;--bg2:#17171a;--card:#1c1c1f;--text:#f4f4f5;--muted:#a1a1aa;--border:#2c2c30;--glow:rgba(248,198,56,.14);--ring:#1c1c1f}}
:root[data-theme=dark]{--bg:#131316;--bg2:#17171a;--card:#1c1c1f;--text:#f4f4f5;--muted:#a1a1aa;--border:#2c2c30;--glow:rgba(248,198,56,.14);--ring:#1c1c1f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--text);background:linear-gradient(var(--bg),var(--bg2));display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
body:before{content:"";position:fixed;left:-10%;right:-10%;bottom:-18vh;height:46vh;background:radial-gradient(ellipse at 50% 100%,var(--glow),transparent 70%);pointer-events:none}
main{position:relative;text-align:center;padding:24px;max-width:520px;width:100%}
.brand{margin-top:44px}
.brand img{height:36px;width:auto;opacity:.75;filter:brightness(0)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .brand img{filter:brightness(0) invert(1)}}
:root[data-theme=dark] .brand img{filter:brightness(0) invert(1)}
.hero{position:relative;width:96px;height:96px;margin:30px auto 74px}
.confetti{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;color:var(--muted);opacity:.5;pointer-events:none;animation:burst 1.2s .1s ease-out both}
.status{position:relative;z-index:1;width:96px;height:96px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.status.ok{background:var(--ok);outline:2px solid var(--ok);outline-offset:7px}
.status.bad{background:var(--bad);outline:2px solid var(--bad);outline-offset:7px}
.status svg{width:48px;height:48px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.status svg path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .25s ease-out forwards}
h1{font-weight:600;font-size:26px;margin:0 0 20px;letter-spacing:-.01em;color:var(--muted)}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.reason{display:inline-block;margin-top:14px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--text);word-break:break-word;max-width:100%}
@keyframes burst{0%{transform:scale(.55);opacity:0}25%{transform:scale(1);opacity:.5}100%{transform:scale(1.06);opacity:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.status,.status svg path{animation:none;stroke-dashoffset:0}}
</style>
</head>
