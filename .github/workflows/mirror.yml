name: Mirror

on:
  push:
    branches: [main]
    tags: ['**']

jobs:
  mirror:
    name: Mirror to GitLab
    runs-on: ubuntu-slim
    timeout-minutes: 30
    environment: main
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "${{ secrets.GITLAB_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          printf 'Host gitlab.com\n\tHostName gitlab.com\n\tIdentityFile ~/.ssh/key\n\tIdentitiesOnly yes\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Mirror to gitlab.com/futrou/futrou-cli.git
        run: |
          git remote add gitlab git@gitlab.com:futrou/futrou-cli.git
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote gitlab refs/heads/main | awk '{print $1}')
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "Already in sync, skipping push."
            exit 0
          fi
          echo "Local:  $LOCAL"
          echo "Remote: $REMOTE"
          git push gitlab HEAD:main || (git pull gitlab main --rebase && git push gitlab HEAD:main)
          # Only push tags GitLab doesn't already have; pushing --tags
          # unconditionally fails the whole command on the first tag that
          # already exists remotely (tags are immutable, so re-pushing an
          # existing one is never needed).
          LOCAL_TAGS=$(git tag)
          REMOTE_TAGS=$(git ls-remote --tags gitlab | awk -F'refs/tags/' '{print $2}' | sed 's/\^{}$//' | sort -u)
          NEW_TAGS=$(comm -23 <(echo "$LOCAL_TAGS" | sort -u) <(echo "$REMOTE_TAGS"))
          if [ -n "$NEW_TAGS" ]; then
            echo "$NEW_TAGS" | xargs git push gitlab
          else
            echo "No new tags to push."
          fi
